plugins {
  id "java-gradle-plugin"
//  id "com.gradle.plugin-publish" version "1.3.1"
}

description = "TODAY Cloud Applications Gradle Plugins"

dependencies {
  api 'cn.taketoday:infra-core'

  optional "org.graalvm.buildtools:native-gradle-plugin"
  implementation 'org.apache.commons:commons-compress'
  implementation 'io.spring.gradle:dependency-management-plugin'
}

gradlePlugin {
  automatedPublishing = true
  website = "https://github.com/today-tech/today-cloud"
  vcsUrl = "https://github.com/today-tech/today-cloud"
  plugins {
    todayCloudPlugin {
      id = "today.cloud-application"
      tags.set(['cloud', 'application'])
      displayName = "TODAY Cloud Applications Gradle Plugin"
      description = "TODAY Cloud Applications Gradle Plugin"
      implementationClass = "infra.cloud.plugin.InfraCloudPlugin"
    }
  }
}

