description = "Demo User API"

dependencies {
  implementation 'cn.taketoday:infra-context'

  compileOnly("org.projectlombok:lombok")
  annotationProcessor("org.projectlombok:lombok")

}

jar {
  manifest.attributes["Specification-Title"] = project.name
  manifest.attributes["Specification-Version"] = project.version
  manifest.attributes["Specification-Vendor"] = 'TODAY Tech'
  manifest.attributes["Specification-Vendor-Id"] = 'cn.taketoday'
}

apply plugin: 'java'

tasks.register('generateServiceMetadata') {
  doLast {
    def outputDir = file("$buildDir/resources/main/META-INF")
    outputDir.mkdirs()

    def propsFile = new File(outputDir, 'service-metadata.properties')
    def props = new Properties()

    props.setProperty('service.id', project.name)
    props.setProperty('service.version', project.version.toString())

    propsFile.withOutputStream { out ->
      props.store(out, "Generated service metadata - DO NOT EDIT")
    }
    println "Generated service metadata: ${propsFile.absolutePath}"
  }
}

processResources.dependsOn('generateServiceMetadata')
